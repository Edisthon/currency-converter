version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: currency_postgres
    restart: always
    environment:
      POSTGRES_DB: currency_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: edisthonn 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 

  app:
    build: .
    container_name: currency_app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db 
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/currency_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: edisthonn
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  postgres_data:
